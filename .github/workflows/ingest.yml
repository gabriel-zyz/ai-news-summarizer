name: ingest

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run ans migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: uv run ans ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
