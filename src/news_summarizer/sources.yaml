# MVP sources: 4 regions x 4 outlets, Chinese and English only.
# kind: rss (one or more feeds) | xinhua | people | cctv | udn (custom parsers in ingest/listings.py)
# Feeds tested 2026-10-25/26. news.com.au blocks crawlers; 7News (Seven West Media) replaces it.
# The Age was rejected: same owner as SMH (Nine) and largely the same articles.

