[project]
name = "news-summarizer"
version = "0.2.0"
description = "Cross-language comparison of how different regions report the same news event"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "trafilatura>=2.0",
]

[project.scripts]
ans = "news_summarizer.cli:main"

[dependency-groups]
dev = [
    "fastapi==0.115.12",
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_summarizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real news sites (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "BLE"]
